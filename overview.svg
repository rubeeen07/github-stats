<svg width="360" height="210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes slideIn {
        from { transform: translateX(-200%); }
        to   { transform: translateX(0); }
      }
      .row { animation: slideIn 0.5s ease-out forwards; opacity: 0; }
      .row1 { animation-delay: 0.0s; }
      .row2 { animation-delay: 0.1s; }
      .row3 { animation-delay: 0.2s; }
      .row4 { animation-delay: 0.3s; }
      .row5 { animation-delay: 0.4s; }
      .row6 { animation-delay: 0.5s; }
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .title { font-size: 14px; font-weight: 600; fill: #58a6ff; }
      .label { font-size: 12px; fill: #c9d1d9; }
      .value { font-size: 12px; fill: #c9d1d9; text-anchor: end; }
    </style>
  </defs>
  <!-- Fondo oscuro con borde -->
  <rect x="5" y="5" width="350" height="200" rx="6" ry="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <!-- Título -->
  <text x="21" y="28" class="title">Rubén's GitHub Statistics</text>

  <!-- Fila 1: Stars -->
  <g class="row row1" transform="translate(21, 52)">
    <path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z" fill="#8b949e"/>
    <text x="22" y="4" class="label">Stars</text>
    <text x="310" y="4" class="value" text-anchor="end">5</text>
  </g>

  <!-- Fila 2: Forks -->
  <g class="row row2" transform="translate(21, 77)">
    <path d="M5 3.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm0 2.122a2.25 2.25 0 10-1.5 0v.878A2.25 2.25 0 005.75 8.5h1.5v2.128a2.251 2.251 0 101.5 0V8.5h1.5a2.25 2.25 0 002.25-2.25v-.878a2.25 2.25 0 10-1.5 0v.878a.75.75 0 01-.75.75h-4.5A.75.75 0 015 6.25v-.878z" fill="#8b949e"/>
    <text x="22" y="4" class="label">Forks</text>
    <text x="310" y="4" class="value" text-anchor="end">0</text>
  </g>

  <!-- Fila 3: All-time contributions -->
  <g class="row row3" transform="translate(21, 102)">
    <path d="M1 2.5A2.5 2.5 0 013.5 0h8.75a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0V1.5h-8a1 1 0 00-1 1v6.708A2.492 2.492 0 013.5 9h3.25a.75.75 0 010 1.5H3.5a1 1 0 100 2h5.75a.75.75 0 010 1.5H3.5A2.5 2.5 0 011 11.5v-9z" fill="#8b949e"/>
    <text x="22" y="4" class="label">All-time contributions</text>
    <text x="310" y="4" class="value" text-anchor="end">239</text>
  </g>

  <!-- Fila 4: Lines of code changed -->
  <g class="row row4" transform="translate(21, 127)">
    <path d="M8.75 1.75a.75.75 0 00-1.5 0V5H4a.75.75 0 000 1.5h3.25v3.25a.75.75 0 001.5 0V6.5H12A.75.75 0 0012 5H8.75V1.75zM4 13a.75.75 0 000 1.5h8a.75.75 0 100-1.5H4z" fill="#8b949e"/>
    <text x="22" y="4" class="label">Lines of code changed</text>
    <text x="310" y="4" class="value" text-anchor="end">75,620</text>
  </g>

  <!-- Fila 5: Repository views -->
  <g class="row row5" transform="translate(21, 152)">
    <path d="M1.679 7.932c.412-.621 1.242-1.75 2.366-2.717C5.175 4.242 6.527 3.5 8 3.5c1.473 0 2.824.742 3.955 1.715 1.124.967 1.954 2.096 2.366 2.717a.119.119 0 010 .136c-.412.621-1.242 1.75-2.366 2.717C10.825 11.758 9.473 12.5 8 12.5c-1.473 0-2.824-.742-3.955-1.715C2.92 9.818 2.09 8.69 1.679 8.068a.119.119 0 010-.136zM8 2c-1.981 0-3.67.992-4.933 2.078C1.797 5.169.88 6.423.43 7.1a1.619 1.619 0 000 1.798c.45.678 1.367 1.932 2.637 3.024C4.329 13.008 6.019 14 8 14c1.981 0 3.67-.992 4.933-2.078 1.27-1.091 2.187-2.345 2.637-3.023a1.619 1.619 0 000-1.798c-.45-.678-1.367-1.932-2.637-3.023C11.671 2.992 9.981 2 8 2z" fill="#8b949e"/>
    <text x="22" y="4" class="label">Repository views (past two weeks)</text>
    <text x="310" y="4" class="value" text-anchor="end">244</text>
  </g>

  <!-- Fila 6: Repositories with contributions -->
  <g class="row row6" transform="translate(21, 177)">
    <path d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9z" fill="#8b949e"/>
    <text x="22" y="4" class="label">Repositories with contributions</text>
    <text x="310" y="4" class="value" text-anchor="end">11</text>
  </g>
</svg>
