<svg width="360" height="210" xmlns="http://www.w3.org/2000/svg">
  <style>
    svg {
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 21px;
    }
    #background {
      width: calc(100% - 10px);
      height: calc(100% - 10px);
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 0.5px;
      rx: 6px;
      ry: 6px;
    }
    foreignObject {
      width: calc(100% - 10px - 32px);
      height: calc(100% - 10px - 32px);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }
    th {
      padding: 0.5em;
      padding-top: 0;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      color: #58a6ff;
    }
    td {
      margin-bottom: 16px;
      margin-top: 8px;
      padding: 0.25em;
      font-size: 12px;
      line-height: 18px;
      color: #c9d1d9;
    }
    tr {
      transform: translateX(-200%);
      animation: slideIn 2s ease-in-out forwards;
    }
    .emoji {
      font-size: 14px;
      margin-right: 1ch;
      vertical-align: middle;
    }
    @keyframes slideIn {
      to {
        transform: translateX(0);
      }
    }
  </style>
  <g>
    <rect x="5" y="5" id="background" />
    <g>
      <foreignObject x="21" y="21" width="318" height="168">
        <div xmlns="http://www.w3.org/1999/xhtml">
          <table>
            <thead>
              <tr style="transform: translateX(0);">
                <th colspan="2">Rubén's GitHub Statistics</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><span class="emoji">⭐</span> Stars</td>
                <td>5</td>
              </tr>
              <tr style="animation-delay: 150ms">
                <td><span class="emoji">🍴</span> Forks</td>
                <td>0</td>
              </tr>
              <tr style="animation-delay: 300ms">
                <td><span class="emoji">📅</span> All-time contributions</td>
                <td>239</td>
              </tr>
              <tr style="animation-delay: 450ms">
                <td><span class="emoji">📝</span> Lines of code changed</td>
                <td>75,620</td>
              </tr>
              <tr style="animation-delay: 600ms">
                <td><span class="emoji">👁️</span> Repository views (past two weeks)</td>
                <td>244</td>
              </tr>
              <tr style="animation-delay: 750ms">
                <td><span class="emoji">📁</span> Repositories with contributions</td>
                <td>11</td>
              </tr>
            </tbody>
          </table>
        </div>
      </foreignObject>
    </g>
  </g>
</svg>
